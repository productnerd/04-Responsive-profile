name: Deploy Fishbowl

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
    paths:
      - 'fishbowl/**'
      - '.github/workflows/deploy-fishbowl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-fishbowl
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fishbowl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: fishbowl/dist
          branch: gh-pages
          clean: true
